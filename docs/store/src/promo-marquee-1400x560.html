<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .wrap { display: grid; grid-template-columns: 520px 1fr; align-items: center; height: 100%; padding: 0 90px; gap: 40px; }
  .logo { position: relative; width: 420px; height: 420px; }
  .logo img { width: 100%; height: 100%; filter: drop-shadow(0 0 50px #ffb02055); }
  .lbl { position: absolute; font-size: 17px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: #0d1016cc; border: 1px solid var(--border); }
  h1 { font-size: 84px; } .lead { font-size: 26px; margin-top: 18px; max-width: 640px; }
</style></head><body><div class="wrap">
  <div class="logo"><img src="assets/icon.svg">
    <span class="lbl" style="left:-10px;top:20px;color:var(--video)">video</span>
    <span class="lbl" style="right:-14px;top:20px;color:var(--audio)">audio</span>
    <span class="lbl" style="left:248px;bottom:-4px;color:var(--subs)" data-t="m_subs"></span>
  </div>
  <div><h1>Fluxy</h1><p class="lead" data-t="m_lead"></p></div>
</div><script src="strings.js"></script></body></html>
