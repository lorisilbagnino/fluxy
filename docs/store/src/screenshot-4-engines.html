<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .wrap { display: grid; grid-template-columns: 1fr 400px; gap: 60px; padding: 64px 80px; height: 100%; }
  .copy { display: flex; flex-direction: column; gap: 22px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; display: grid; gap: 12px; align-content: start; }
  .card.on { border-color: #ffb02099; background: linear-gradient(160deg, #2a2416, var(--card)); }
  .card h2 { font-size: 23px; } .tag { justify-self: start; font-size: 13px; padding: 3px 9px; border-radius: 999px; background: #35c47c22; color: #35c47c; }
  .card ul { padding-left: 18px; color: #cfd5e0; font-size: 16px; line-height: 1.6; }
  .popup { align-self: center; width: 400px; }
</style></head><body>
<div class="wrap">
  <div class="copy">
    <div class="brand"><img src="assets/icon.svg">Fluxy</div>
    <h1 data-t="s4_h1"></h1>
    <p class="lead" data-t="s4_lead"></p>
    <div class="cards">
      <div class="card on"><span class="tag" data-t="s4_tag1"></span><h2 data-t="s4_h1a"></h2><ul data-t="s4_l1"></ul></div>
      <div class="card"><span class="tag" style="background:#ffffff10;color:var(--muted)" data-t="s4_tag2"></span><h2 data-t="s4_h1b"></h2><ul data-t="s4_l2"></ul></div>
    </div>
  </div>
  <div class="popup shadow"><img data-img="assets/popup-settings-{lang}.png"></div>
</div><script src="strings.js"></script></body></html>
