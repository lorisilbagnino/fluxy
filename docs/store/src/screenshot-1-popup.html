<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .wrap { display: grid; grid-template-columns: 410px 1fr; gap: 40px; padding: 64px 0 0 70px; height: 100%; }
  .copy { display: flex; flex-direction: column; gap: 26px; padding-top: 30px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .browser { position: relative; width: 760px; height: 760px; border-radius: 14px 0 0 0; background: #0b0e13; overflow: hidden; }
  .bar { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #1d2330; border-bottom: 1px solid #2c3445; }
  .dots { display: flex; gap: 7px; } .dots i { width: 12px; height: 12px; border-radius: 50%; background: #3a4356; }
  .url { flex: 1; height: 28px; border-radius: 8px; background: #11151d; color: #8b95a7; font-size: 14px; display: flex; align-items: center; padding: 0 12px; }
  .ext { width: 30px; height: 30px; border-radius: 7px; background: #2a3242; display: grid; place-items: center; position: relative; }
  .ext img { width: 22px; } .ext b { position: absolute; right: -5px; top: -5px; background: #f59e0b; color: #1a1200; font-size: 10px; padding: 1px 4px; border-radius: 6px; }
  .page { padding: 26px 30px; }
  .player { width: 520px; height: 292px; border-radius: 10px; overflow: hidden; position: relative; background: url(scene.svg) center/cover; }
  .ctrl { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: linear-gradient(transparent, #000a); display: flex; align-items: center; gap: 12px; padding: 0 14px; }
  .ctrl .p { width: 0; height: 0; border-left: 12px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
  .ctrl .t { flex: 1; height: 4px; border-radius: 2px; background: #ffffff40; } .ctrl .t i { display: block; width: 34%; height: 100%; background: #fff; border-radius: 2px; }
  .ptitle { margin-top: 18px; font-size: 22px; font-weight: 700; } .psub { margin-top: 6px; color: #8b95a7; font-size: 15px; }
  .lines i { display: block; height: 10px; border-radius: 5px; background: #1c2230; margin-top: 12px; }
  .popup { position: absolute; right: 18px; top: 54px; width: 360px; }
</style></head><body>
<div class="wrap">
  <div class="copy">
    <div class="brand"><img src="assets/icon.svg">Fluxy</div>
    <h1 data-t="s1_h1"></h1>
    <p class="lead" data-t="s1_lead"></p>
    <div class="chips">
      <span class="chip"><i style="background:var(--video)"></i><span data-t="s1_c1"></span></span>
      <span class="chip"><i style="background:var(--audio)"></i><span data-t="s1_c2"></span></span>
      <span class="chip"><i style="background:var(--subs)"></i><span data-t="s1_c3"></span></span>
    </div>
  </div>
  <div class="browser shadow">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url" data-t="s1_url"></div><div class="ext"><img src="assets/icon.svg"><b>1</b></div></div>
    <div class="page">
      <div class="player"><div class="ctrl"><span class="p"></span><span class="t"><i></i></span></div></div>
      <div class="ptitle" data-t="film"></div>
      <div class="psub" data-t="s1_sub"></div>
      <div class="lines"><i style="width:520px"></i><i style="width:470px"></i><i style="width:500px"></i></div>
    </div>
    <div class="popup shadow"><img data-img="assets/popup-streams-{lang}.png"></div>
  </div>
</div><script src="strings.js"></script></body></html>
