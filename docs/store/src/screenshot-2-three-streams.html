<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .top { padding: 60px 80px 0; display: flex; flex-direction: column; gap: 16px; }
  .top h1 { font-size: 56px; }
  svg.flow { position: absolute; left: 0; top: 250px; width: 1280px; height: 520px; }
  .lane { position: absolute; left: 80px; display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 600; }
  .lane small { display: block; font-weight: 400; color: var(--muted); font-size: 15px; margin-top: 2px; }
  .dot { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; font-weight: 800; color: #10131a; }
  .file { position: absolute; right: 80px; top: 360px; width: 330px; padding: 22px 24px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); }
  .file h3 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .file h3 span { font-size: 12px; padding: 2px 7px; border-radius: 5px; background: var(--accent); color: #1a1200; }
  .file ul { list-style: none; padding: 0; margin-top: 14px; display: grid; gap: 9px; font-size: 16px; color: #cfd5e0; }
  .file li { display: flex; align-items: center; gap: 10px; } .file li i { width: 10px; height: 10px; border-radius: 3px; }
  .note { position: absolute; left: 80px; bottom: 40px; font-size: 18px; color: var(--muted); }
  .note b { color: var(--text); }
</style></head><body>
<div class="top">
  <div class="brand"><img src="assets/icon.svg">Fluxy</div>
  <h1 data-t="s2_h1"></h1>
  <p class="lead" style="max-width:820px" data-t="s2_lead"></p>
</div>
<svg class="flow" viewBox="0 0 1280 520">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="core"><stop offset="0" stop-color="#fff7d6"/><stop offset=".5" stop-color="#ffc83d"/><stop offset="1" stop-color="#ff8a00" stop-opacity="0"/></radialGradient>
  </defs>
  <g fill="none" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
    <path d="M330 60 C 560 60, 600 190, 760 200" stroke="#ffb020"/>
    <path d="M330 200 C 520 200, 600 200, 760 200" stroke="#4fd1c5"/>
    <path d="M330 340 C 560 340, 600 210, 760 200" stroke="#a78bfa"/>
    <path d="M760 200 L 870 200" stroke="#ffd25e" stroke-width="10"/>
  </g>
  <g>
    <g fill="#ffb020" opacity=".85"><rect x="360" y="44" width="26" height="32" rx="5"/><rect x="396" y="44" width="26" height="32" rx="5"/><rect x="432" y="44" width="26" height="32" rx="5" opacity=".6"/></g>
    <g fill="#4fd1c5" opacity=".85"><rect x="360" y="184" width="26" height="32" rx="5"/><rect x="396" y="184" width="26" height="32" rx="5"/><rect x="432" y="184" width="26" height="32" rx="5" opacity=".6"/></g>
    <g fill="#a78bfa" opacity=".85"><rect x="360" y="324" width="26" height="32" rx="5"/><rect x="396" y="324" width="26" height="32" rx="5"/><rect x="432" y="324" width="26" height="32" rx="5" opacity=".6"/></g>
  </g>
  <circle cx="760" cy="200" r="34" fill="url(#core)"/>
</svg>
<div class="lane" style="top:286px"><span class="dot" style="background:var(--video)">V</span><div><span data-t="video"></span><small>1080p · H.264</small></div></div>
<div class="lane" style="top:426px"><span class="dot" style="background:var(--audio)">A</span><div><span data-t="audio"></span><small data-t="s2_audio"></small></div></div>
<div class="lane" style="top:566px"><span class="dot" style="background:var(--subs)">S</span><div><span data-t="subtitles"></span><small data-t="s2_subs"></small></div></div>
<div class="file shadow">
  <h3><span data-t="s2_file" style="all:unset"></span> <span>MKV</span></h3>
  <ul>
    <li><i style="background:var(--video)"></i>Video 1920×1080</li>
    <li><i style="background:var(--audio)"></i><span data-t="s2_i2"></span></li>
    <li><i style="background:var(--audio)"></i>Audio English 5.1</li>
    <li><i style="background:var(--subs)"></i><span data-t="s2_i4"></span></li>
    <li><i style="background:var(--subs)"></i><span data-t="s2_i5"></span></li>
  </ul>
</div>
<p class="note" data-t="s2_note"></p>
<script src="strings.js"></script></body></html>
