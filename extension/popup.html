<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fluxy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<!-- Texts: data-i18n (text), data-i18n-title, data-i18n-aria — keys in _locales/*/messages.json -->
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>Fluxy</h1>
    <span id="host-status" class="pill" data-i18n-title="engineStatusTitle">…</span>
    <button id="btn-settings" class="icon-btn" data-i18n-title="settings" data-i18n-aria="settings">⚙</button>
  </header>

  <section id="host-warning" class="notice" hidden></section>

  <section id="settings" class="panel" hidden>
    <div class="field">
      <span class="field-title" data-i18n="engine"></span>
      <label class="choice">
        <input type="radio" name="engine" value="browser">
        <span><span data-i18n="engineBrowser"></span>
          <small data-i18n="engineBrowserHelp"></small></span>
      </label>
      <label class="choice">
        <input type="radio" name="engine" value="native">
        <span><span data-i18n="engineNative"></span>
          <small data-i18n="engineNativeHelp"></small></span>
      </label>
    </div>
    <div id="native-box" class="subpanel">
      <div class="native-status">
        <span id="native-text" class="muted">…</span>
        <button id="btn-verify" class="link" data-i18n="verify"></button>
        <button id="btn-install" class="ghost" data-i18n="installLocalApp"></button>
      </div>
      <div id="install-help" class="install-help" hidden></div>
      <label id="dir-field"><span data-i18n="outputDir"></span>
        <input id="set-dir" type="text" spellcheck="false">
      </label>
    </div>
    <div class="row">
      <label><span data-i18n="defaultFormat"></span>
        <select id="set-container"><option value="mkv">MKV</option><option value="mp4">MP4</option></select>
      </label>
      <label><span data-i18n="parallel"></span>
        <input id="set-fragments" type="number" min="1" max="32">
      </label>
    </div>
    <label class="check">
      <input id="set-auto" type="checkbox">
      <span><span data-i18n="autoDetect"></span>
        <small data-i18n="autoDetectHelp"></small></span>
    </label>
    <label class="check">
      <input id="set-rec-convert" type="checkbox">
      <span><span data-i18n="recConvert"></span>
        <small data-i18n="recConvertHelp"></small></span>
    </label>
    <label><span data-i18n="prefLangs"></span>
      <input id="set-langs" type="text" placeholder="en, it" spellcheck="false">
    </label>
    <a id="donate" class="donate" target="_blank" rel="noopener" hidden data-i18n="donate"></a>
  </section>

  <main>
    <div class="section-head" id="jobs-head" hidden>
      <h2 data-i18n="downloads"></h2>
      <button id="btn-clear-jobs" class="link" data-i18n="clearFinished"></button>
    </div>
    <div id="jobs"></div>

    <div class="section-head">
      <h2 data-i18n="streamsInTab"></h2>
      <button id="btn-clear-tab" class="link" data-i18n="clear" data-i18n-title="clearTitle"></button>
    </div>
    <div id="detect" class="detect" hidden>
      <span id="detect-text"></span>
      <button id="btn-stop" class="link" hidden data-i18n="stop"></button>
      <button id="btn-detect" class="ghost" data-i18n-title="detectTitle"></button>
    </div>
    <div id="page-card" class="detect page-card" hidden>
      <span><b data-i18n="pageCardTitle"></b> — <span data-i18n="pageCardText"></span></span>
      <button id="btn-page" class="ghost" data-i18n="pageCardButton"></button>
    </div>
    <div id="streams"></div>
    <p id="empty" class="muted" hidden></p>

    <div class="section-head">
      <h2 data-i18n="recSection"></h2>
    </div>
    <div class="rec-box">
      <span class="rec-text"><span data-i18n="recBoxTitle"></span>
        <small data-i18n="recBoxHelp"></small></span>
      <button id="btn-rec" class="ghost" data-i18n="recButton"></button>
    </div>
    <div id="rec-error" class="err rec-error" hidden></div>

  </main>

  <template id="tpl-stream">
    <article class="card">
      <div class="card-head">
        <span class="kind"></span>
        <span class="meta muted"></span>
        <button class="link copy-url" data-i18n="copyUrl" data-i18n-title="copyUrlTitle"></button>
      </div>
      <div class="body"></div>
    </article>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
