<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fluxy</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="settings.css">
</head>
<!-- Texts: data-i18n (text), data-i18n-title, data-i18n-aria — keys in _locales/*/messages.json -->
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>Fluxy</h1>
    <span id="host-status" class="pill" data-i18n-title="engineStatusTitle">…</span>
    <a class="gh" href="https://github.com/lorisilbagnino/fluxy" target="_blank" rel="noopener" data-i18n-title="githubTitle">GitHub</a>
    <button id="btn-open-page" class="icon-btn open-page" data-i18n-title="openPage" data-i18n-aria="openPage">⤢</button>
    <button id="btn-settings" class="icon-btn" data-i18n-title="settings" data-i18n-aria="settings">⚙</button>
  </header>

  <section id="host-warning" class="notice" hidden></section>

  <section id="settings" class="panel" hidden>
    <div id="settings-body" class="panel-body"></div>
    <a id="donate" class="donate" target="_blank" rel="noopener" hidden><img src="icons/kofi-cup.png" alt="Ko-fi"><span data-i18n="donate"></span></a>
    <!-- Appropriate Legal Notices (GPL-3.0 §5d, ADDITIONAL-TERMS.md term 1): keep in modified versions -->
    <a id="credits" class="credits" href="https://github.com/lorisilbagnino/fluxy" target="_blank" rel="noopener"></a>
  </section>

  <main>
    <div class="section-head" id="jobs-head" hidden>
      <h2 data-i18n="downloads"></h2>
      <span class="head-actions">
        <span id="speed-limit"></span>
        <button id="btn-clear-jobs" class="link" data-i18n="clearHistory"></button>
        <button id="btn-manager" class="link" hidden></button>
      </span>
    </div>
    <div id="jobs-overall"></div>
    <div id="jobs"></div>

    <div class="section-head">
      <h2 data-i18n="streamsInTab"></h2>
      <button id="btn-clear-tab" class="link" data-i18n="clear" data-i18n-title="clearTitle"></button>
    </div>
    <div id="detect" class="detect" hidden>
      <span id="detect-text"></span>
      <button id="btn-stop" class="link" hidden data-i18n="stop"></button>
      <button id="btn-detect" class="ghost" data-i18n-title="detectTitle"></button>
    </div>
    <div id="page-card" class="detect page-card" hidden>
      <span><b data-i18n="pageCardTitle"></b> — <span data-i18n="pageCardText"></span></span>
      <button id="btn-page" class="ghost" data-i18n="pageCardButton"></button>
    </div>
    <div id="streams"></div>
    <p id="scan-hint" class="muted hint" hidden></p>
    <p id="empty" class="muted" hidden></p>

  </main>

  <template id="tpl-stream">
    <article class="card">
      <div class="card-head">
        <span class="kind"></span>
        <span class="meta muted"></span>
        <button class="link copy-url" data-i18n="copyUrl" data-i18n-title="copyUrlTitle"></button>
      </div>
      <div class="body"></div>
    </article>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
