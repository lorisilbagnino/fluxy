<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Fluxy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>Fluxy</h1>
    <span id="host-status" class="pill" title="Motore di download">…</span>
    <button id="btn-settings" class="icon-btn" title="Impostazioni" aria-label="Impostazioni">⚙</button>
  </header>

  <section id="host-warning" class="notice" hidden></section>

  <section id="settings" class="panel" hidden>
    <div class="field">
      <span class="field-title">Motore</span>
      <label class="choice">
        <input type="radio" name="engine" value="browser">
        <span>Tutto nel browser
          <small>Niente da installare. Il file finisce nella cartella Download del browser. Solo HLS.</small></span>
      </label>
      <label class="choice">
        <input type="radio" name="engine" value="native">
        <span>App locale (ffmpeg + yt-dlp)
          <small>Anche DASH, cartella di destinazione a scelta, unione con ffmpeg.</small></span>
      </label>
    </div>
    <div id="native-box" class="subpanel">
      <div class="native-status">
        <span id="native-text" class="muted">App locale: …</span>
        <button id="btn-verify" class="link">verifica</button>
        <button id="btn-install" class="ghost">Installa app locale</button>
      </div>
      <div id="install-help" class="install-help" hidden></div>
      <label id="dir-field">Cartella di destinazione (app locale)
        <input id="set-dir" type="text" spellcheck="false">
      </label>
    </div>
    <div class="row">
      <label>Formato predefinito
        <select id="set-container"><option value="mkv">MKV</option><option value="mp4">MP4</option></select>
      </label>
      <label>Connessioni in parallelo
        <input id="set-fragments" type="number" min="1" max="32">
      </label>
    </div>
    <label class="check">
      <input id="set-auto" type="checkbox">
      <span>Rilevamento automatico su tutte le schede
        <small>Se disattivo, l'estensione non osserva la rete finché non premi “Rileva” su una scheda.</small></span>
    </label>
    <label class="check">
      <input id="set-rec-convert" type="checkbox">
      <span>Converti le registrazioni nel formato predefinito
        <small>MKV: stesse tracce del WebM registrato, senza ricodifica. MP4: H.264 + AAC, registrato direttamente in H.264 dove il browser lo permette, altrimenti convertito allo stop. Se disattivo, salva il WebM registrato dal browser.</small></span>
    </label>
    <label>Lingue preferite (preselezionate)
      <input id="set-langs" type="text" placeholder="it, en" spellcheck="false">
    </label>
  </section>

  <main>
    <div class="section-head" id="jobs-head" hidden>
      <h2>Download</h2>
      <button id="btn-clear-jobs" class="link">rimuovi completati</button>
    </div>
    <div id="jobs"></div>

    <div class="rec-box">
      <span class="rec-text">Videochiamate e video WebRTC
        <small>Clicca un video della pagina e registralo.</small></span>
      <button id="btn-rec" class="ghost">● Registra un video</button>
    </div>
    <div id="rec-error" class="err rec-error" hidden></div>

    <div class="section-head">
      <h2>Stream in questa scheda</h2>
      <button id="btn-clear-tab" class="link" title="Svuota l'elenco">svuota</button>
    </div>
    <div id="detect" class="detect" hidden>
      <span id="detect-text"></span>
      <button id="btn-stop" class="link" hidden>ferma</button>
      <button id="btn-detect" class="ghost" title="Ricarica la pagina e intercetta gli stream che il player carica">⟳ Rileva</button>
    </div>
    <div id="streams"></div>
    <p id="empty" class="muted" hidden></p>

  </main>

  <template id="tpl-stream">
    <article class="card">
      <div class="card-head">
        <span class="kind"></span>
        <span class="meta muted"></span>
        <button class="link copy-url" title="Copia l'URL del manifest">copia URL</button>
      </div>
      <div class="body"></div>
    </article>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
